name: MoonBit CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install MoonBit Toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Verify Code Formatting
        run: $HOME/.moon/bin/moon fmt --check

      - name: Interface Integrity Check
        run: $HOME/.moon/bin/moon info

      - name: Type Check & Lint
        run: $HOME/.moon/bin/moon check

      - name: Run Test Suite
        run: $HOME/.moon/bin/moon test
