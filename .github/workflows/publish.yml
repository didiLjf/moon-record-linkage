name: Publish Mooncakes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install stable MoonBit
        run: |
          curl --fail --silent --show-error --location https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Validate package before publishing
        run: |
          moon version --all
          moon update
          moon fmt --check
          moon info
          moon check --deny-warn --target all
          moon test --deny-warn --target all

      - name: Publish to Mooncakes
        env:
          MOONCAKES_MOONBIT_COMMUNITY_TOKEN: ${{ secrets.MOONCAKES_MOONBIT_COMMUNITY_TOKEN }}
        run: |
          if [ -z "$MOONCAKES_MOONBIT_COMMUNITY_TOKEN" ]; then
            echo "Configure MOONCAKES_MOONBIT_COMMUNITY_TOKEN before running this workflow."
            exit 1
          fi
          moon publish
